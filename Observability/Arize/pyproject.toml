[project]
name = "langgraph-local-agent"
version = "0.1.0"
description = "A simple LangGraph service using a local Llama agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "python-dotenv",
    "openinference-instrumentation-langchain>=0.1.55",
    "arize-otel>=0.11.0",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "arize-phoenix-otel>=0.14.0",
]

[tool.uv]
# No specific uv settings needed for now, but section can exist
